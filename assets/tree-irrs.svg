oke="#F06667" stroke-width="0.8"/><text x="344" y="852" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Not seen as forced</text><text x="344" y="870" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Derivative family</text><text x="344" y="888" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Secondary movers</text><text x="344" y="906" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Later voluntary move</text><text x="344" y="924" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Non-disclosure</text></g><g id="irrs-exc-o4"><rect x="481" y="832" width="150" height="122" rx="8" fill="#FDEDED" stroke="#F06667" stroke-width="0.8"/><text x="491" y="852" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Later voluntary move</text><text x="491" y="870" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Reunified family</text><text x="491" y="888" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Ceased protection,</text><text x="491" y="906" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">counted as int.</text><text x="491" y="924" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-
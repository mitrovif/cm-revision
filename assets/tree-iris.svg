<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2160" viewBox="0 0 680 1080"><defs><marker id="iris-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="1080" fill="#FFFFFF"/><text x="40" y="28" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Figure 2. Identifying IRIS populations through census questions</text><g transform="translate(0,46)"><g id="iris-start"><rect x="250" y="20" width="180" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340" y="40" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Census population</text></g><line x1="340" y1="60" x2="340" y2="86" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><g id="iris-q-ix"><rect x="250" y="90" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="108.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">(ix) Forced to flee?</text><text x="340.0" y="128.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Asked of all persons</text></g><path d="M250 118 L97 118 L97 300" fill="none" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-no"><rect x="77.0" y="300" width="40" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="97" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">No</text></g><line x1="97" y1="324" x2="97" y2="576" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><line x1="340" y1="146" x2="340" y2="156" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-yes"><rect x="318.0" y="156" width="44" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="340" y="168" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Yes</text></g><line x1="340" y1="180" x2="340" y2="196" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><g id="iris-q-xiii"><rect x="250" y="200" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="218.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">(xiii) Fled to where?</text><text x="340.0" y="238.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">First place fled to</text></g><path d="M250 228 L218 228 L218 300" fill="none" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-abroad"><rect x="186.0" y="300" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="218" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Abroad</text></g><line x1="218" y1="324" x2="218" y2="576" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><line x1="340" y1="256" x2="340" y2="266" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-within"><rect x="290.0" y="266" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="340" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Within country</text></g><line x1="340" y1="290" x2="340" y2="306" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><g id="iris-q-cmp"><rect x="250" y="310" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="328.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Compare locations</text><text x="340.0" y="348.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">(i) now vs (xii), (xiii)</text></g><line x1="340" y1="366" x2="340" y2="400" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-eq-xiii"><rect x="296.0" y="400" width="88" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="340" y="412" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">(i) = (xiii)</text></g><line x1="340" y1="424" x2="340" y2="576" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><path d="M410 366 L410 390 L461 390 L461 440" fill="none" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-eq-xii"><rect x="419.0" y="440" width="84" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="461" y="452" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">(i) = (xii)</text></g><line x1="461" y1="464" x2="461" y2="576" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><path d="M430 338 L583 338 L583 400" fill="none" stroke="#73726c" stroke-width="1.2"/><g id="iris-p-neither"><rect x="551.0" y="400" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="583" y="412" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Neither</text></g><line x1="583" y1="424" x2="583" y2="576" stroke="#73726c" stroke-width="1.2" marker-end="url(#iris-a)"/><g id="iris-out-n1"><rect x="40" y="580" width="114" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="97.0" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Not counted</text><text x="97.0" y="618.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">No forced move</text></g><g id="iris-out-n2"><rect x="161" y="580" width="114" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="218.0" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Not counted</text><text x="218.0" y="618.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Fled abroad</text></g><g id="iris-out-d"><rect x="283" y="580" width="114" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Displacement</text><text x="340.0" y="618.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">IDP location</text></g><g id="iris-out-r"><rect x="404" y="580" width="114" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="461.0" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Return</text><text x="461.0" y="618.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">IDP location</text></g><g id="iris-out-o"><rect x="526" y="580" width="114" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="583.0" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Elsewhere</text><text x="583.0" y="618.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Other settlement</text></g><text x="40" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Inclusion errors: wrongly counted</text><g id="iris-inc-n1"><rect x="40" y="684" width="114" height="104" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="50" y="704" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">None</text></g><g id="iris-inc-n2"><rect x="161" y="684" width="114" height="104" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="171" y="704" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">None</text></g><g id="iris-inc-d"><rect x="283" y="684" width="114" height="104" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="293" y="704" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Exit not</text><text x="293" y="722" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">measurable</text><text x="293" y="740" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Out-of-scope</text><text x="293" y="758" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">reasons, if (x)</text><text x="293" y="776" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">not asked</text></g><g id="iris-inc-r"><rect x="404" y="684" width="114" height="104" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="414" y="704" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Exit not</text><text x="414" y="722" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">measurable</text><text x="414" y="740" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Displaced within</text><text x="414" y="758" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">same area</text><text x="414" y="776" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">(coded as return)</text></g><g id="iris-inc-o"><rect x="526" y="684" width="114" height="104" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="536" y="704" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Exit not</text><text x="536" y="722" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">measurable</text></g><text x="40" y="820" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Exclusion errors: missed</text><g id="iris-exc-n1"><rect x="40" y="832" width="114" height="122" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="50" y="852" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Away when event</text><text x="50" y="870" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">occurred</text><text x="50" y="888" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Not asked of all</text><text x="50" y="906" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">(often children)</text><text x="50" y="924" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Not disclosed</text></g><g id="iris-exc-n2"><rect x="161" y="832" width="114" height="122" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="171" y="852" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Abroad under 12</text><text x="171" y="870" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">months, then</text><text x="171" y="888" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">came back</text></g><g id="iris-exc-d"><rect x="283" y="832" width="114" height="122" rx="8" fill="#FAECE7" s
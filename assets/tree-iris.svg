13" text-anchor="start" dominant-baseline="central">IDP-related: children born after displacement only via a household link; non-displaced</text><text x="50" y="1010" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">family members and those who overcame vulnerabilities are not identified.</text></g></g></svg>
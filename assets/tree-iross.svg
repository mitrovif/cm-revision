="middle" dominant-baseline="central">(i) Country of birth</text><text x="340.0" y="258.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#3B71B9" text-anchor="middle" dominant-baseline="central">Core, adds &quot;Unknown&quot;</text></g><line x1="340" y1="276" x2="340" y2="330" stroke="#5A6884" stroke-width="1.2"/><g id="iross-p-b-census"><rect x="288.0" y="330" width="104" height="24" rx="12" fill="#FFFFFF" stroke="#B9C7DC" stroke-width="0.8"/><text x="340" y="342" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1D2940" text-anchor="middle" dominant-baseline="central">Census country</text></g><line x1="340" y1="354" x2="340" y2="576" stroke="#5A6884" stroke-width="1.2" marker-end="url(#iross-a)"/><path d="M430 248 L461 248 L461 400" fill="none" stroke="#5A6884" stroke-width="1.2"/><g id="iross-p-b-foreign"><rect x="407.0" y="400" width="108" height="24" rx="12" fill="#FFFFFF" stroke="#B9C7DC" stroke-width="0.8"/><text x="461" y="412" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1D2940" text-anchor="middle" dominant-baseline="central">Foreign country</text></g><line x1="461" y1="424" x2="461" y2="576" stroke="#5A6884" stroke-width="1.2" marker-end="url(#iross-a)"/><g id="iross-out-c1"><rect x="40" y="580" width="114" height="56" rx="8" fill="#F1F4F8" stroke="#B9C7DC" stroke-width="0.8"/><text x="97.0" y="598.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#1D2940" text-anchor="middle" dominant-baseline="central">Not counted</text><text x="97.0" y="618.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6884" text-anchor="middle" dominant-baseline="central">Citizens</text></g><g id="iross-out-c2"><rect x="161" y="580" width="114" height="56" rx="8" fill="#F1F4F8" stroke="#B9C7DC" stroke-width="0.8"/><text x="218.0" y="598.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#1D2940" text-anchor="middle" dominant-baseline="central">Not counted</text><text x="218.0" y="618.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6884" text-anchor="middle" dominant-baseline="central">Foreign citizens</text></g><g id="iross-out-anb"><rect x="283" y="580" width="114" height="56" rx="8" fill="#E4F6F7" stroke="#2A9DA3" stroke-width="0.8"/><text x="340.0" y="598.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#14234C" text-anchor="middle" dominant-baseline="central">Category A</text><text x="340.0" y="618.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1F6F74" text-anchor="middle" dominant-baseline="central">Native-born</text></g><g id="iross-out-afb"><rect x="404" y="580" width="114" height="56" rx="8" fill="#E4F6F7" stroke="#2A9DA3" stroke-width="0.8"/><text x="461.0" y="598.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#14234C" text-anchor="middle" dominant-baseline="central">Category A</text><text x="461.0" y="618.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1F6F74" text-anchor="middle" dominant-baseline="central">Foreign-born</text></g><g id="iross-out-pa"><rect x="526" y="580" width="114" height="56" rx="8" fill="#F1F4F8" stroke="#B9C7DC" stroke-width="0.8"/><text x="583.0" y="598.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#1D2940" text-anchor="middle" dominant-baseline="central">Possible A</text><text x="583.0" y="618.0" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#5A6884" text-anchor="middle" dominant-baseline="central">Report separately</text></g><text x="40" y="672" font-family="Figtree, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#14234C" text-anchor="start" dominant-baseline="central">Inclusion errors: wrongly counted</text><g id="iross-inc-c1"><rect x="40" y="684" width="114" height="86" rx="8" fill="#FBF3E1" stroke="#E0A93B" stroke-width="0.8"/><text x="50" y="704" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">None</text></g><g id="iross-inc-c2"><rect x="161" y="684" width="114" height="86" rx="8" fill="#FBF3E1" stroke="#E0A93B" stroke-width="0.8"/><text x="171" y="704" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">None</text></g><g id="iross-inc-anb"><rect x="283" y="684" width="114" height="86" rx="8" fill="#FBF3E1" stroke="#E0A93B" stroke-width="0.8"/><text x="293" y="704" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">Nationals who</text><text x="293" y="722" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">report stateless</text><text x="293" y="740" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">(no documents,</text><text x="293" y="758" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">misunderstood)</text></g><g id="iross-inc-afb"><rect x="404" y="684" width="114" height="86" rx="8" fill="#FBF3E1" stroke="#E0A93B" stroke-width="0.8"/><text x="414" y="704" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">Nationals who</text><text x="414" y="722" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">report stateless</text><text x="414" y="740" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">(no documents,</text><text x="414" y="758" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">misunderstood)</text></g><g id="iross-inc-pa"><rect x="526" y="684" width="114" height="86" rx="8" fill="#FBF3E1" stroke="#E0A93B" stroke-width="0.8"/><text x="536" y="704" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">Non-response,</text><text x="536" y="722" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#6B4A0E" text-anchor="start" dominant-baseline="central">if counted as A</text></g><text x="40" y="802" font-family="Figtree, IBM Plex Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#14234C" text-anchor="start" dominant-baseline="central">Exclusion errors: missed</text><g id="iross-exc-c1"><rect x="40" y="814" width="114" height="122" rx="8" fill="#FDEDED" stroke="#F06667" stroke-width="0.8"/><text x="50" y="834" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Stateless who</text><text x="50" y="852" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">report citizen</text><text x="50" y="870" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">(fear, proxy,</text><text x="50" y="888" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">no &quot;stateless&quot;</text><text x="50" y="906" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">option, mixed</text><text x="50" y="924" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">with ethnicity)</text></g><g id="iross-exc-c2"><rect x="161" y="814" width="114" height="122" rx="8" fill="#FDEDED" stroke="#F06667" stroke-width="0.8"/><text x="171" y="834" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Stateless who</text><text x="171" y="852" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">report a linked</text><text x="171" y="870" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">country or their</text><text x="171" y="888" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">birth country</text></g><g id="iross-exc-anb"><rect x="283" y="814" width="114" height="122" rx="8" fill="#FDEDED" stroke="#F06667" stroke-width="0.8"/><text x="293" y="834" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">None here</text></g><g id="iross-exc-afb"><rect x="404" y="814" width="114" height="122" rx="8" fill="#FDEDED" stroke="#F06667" stroke-width="0.8"/><text x="414" y="834" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">None here</text></g><g id="iross-exc-pa"><rect x="526" y="814" width="114" height="122" rx="8" fill="#FDEDED" stroke="#F06667" stroke-width="0.8"/><text x="536" y="834" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">Stateless coded</text><text x="536" y="852" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">&quot;unknown&quot;, if</text><text x="536" y="870" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#8A2B2C" text-anchor="start" dominant-baseline="central">not counted</text></g><g id="iross-note"><rect x="40" y="956" width="600" height="86" rx="8" fill="#F1F4F8" stroke="#B9C7DC" stroke-width="0.8"/><text x="50" y="976" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1D2940" text-anchor="start" dominant-baseline="central">Categories B and C are mixed: recognition needs registers, group recognition or</text><text x="50" y="994" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1D2940" text-anchor="start" dominant-baseline="central">an extra question. Country of birth &quot;unknown&quot; gives category A with no split.</text><text x="50" y="1012" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1D2940" text-anchor="start" dominant-baseline="central">Omitted from the census entirely: not reached by any branch.</text><text x="50" y="1030" font-family="IBM Plex Sans, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#1D2940" text-anchor="start" dominant-baseline="central">Stateless-related groups and the overlap with IRRS: see explanations.</text></g></g></svg>
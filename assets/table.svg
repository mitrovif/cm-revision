<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1544" viewBox="0 0 880 772"><rect width="880" height="772" fill="#FFFFFF"/><text x="20" y="28" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Table 1. Inclusion and exclusion errors by IRRS sub-group (census, Box A.2 questions)</text><rect x="20" y="60" width="840" height="30" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="28" y="75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">IRRS sub-group</text><text x="258" y="75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">Identified?</text><text x="408" y="75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">Inclusion errors</text><text x="623" y="75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">Exclusion errors</text><rect x="20" y="90" width="840" height="26" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="28" y="103" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Persons in need of international protection (IRRS paras 90 to 92)</text><rect x="20" y="116" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="130" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Prospective asylum seekers, asylum</text><text x="28" y="146" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">seekers</text><text x="258" y="130" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Yes, not separately</text><text x="408" y="130" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="130" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central"></text><rect x="20" y="160" width="840" height="60" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="174" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Persons with determined protection</text><text x="28" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">status</text><text x="258" y="174" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Yes, if reason (d)</text><text x="408" y="174" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="174" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Another main reason given: derivative</text><text x="623" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">family, sur place who moved, secondary</text><text x="623" y="206" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">movers, later voluntary move</text><rect x="20" y="220" width="840" height="28" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="234" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Others in refugee-like situations</text><text x="258" y="234" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Yes, if reason (d)</text><text x="408" y="234" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="234" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">As above</text><rect x="20" y="248" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Children born in the country, no</text><text x="28" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">host citizenship</text><text x="258" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">No</text><text x="408" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Native-born; only via household link</text><text x="623" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">to a parent</text><rect x="20" y="292" width="840" height="28" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="306" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Refugees sur place who never moved</text><text x="258" y="306" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">No</text><text x="408" y="306" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="306" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">No international move</text><rect x="20" y="320" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Stateless refugees</text><text x="258" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Only if (ii) includes</text><text x="258" y="350" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">stateless</text><text x="408" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="334" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Missed if (ii) coded foreign only</text><rect x="20" y="364" width="840" height="60" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Not in this stock</text><text x="258" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central"></text><text x="408" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Out-of-scope forced moves</text><text x="408" y="394" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">(disaster, hardship); ceased</text><text x="408" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">protection, not naturalised</text><text x="623" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central"></text><rect x="20" y="424" width="840" height="26" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="28" y="437" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Persons with a refugee background (IRRS paras 93 to 94)</text><rect x="20" y="450" width="840" height="28" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="464" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Naturalised former refugees</text><text x="258" y="464" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Yes, if reason (d)</text><text x="408" y="464" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Never held protection status</text><text x="623" y="464" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Later voluntary move</text><rect x="20" y="478" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Children and descendants with</text><text x="28" y="508" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">citizenship</text><text x="258" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Household link only</text><text x="408" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Not living with, or parent not</text><text x="623" y="508" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">identified</text><rect x="20" y="522" width="840" height="28" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="536" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Reunified family members</text><text x="258" y="536" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">No</text><text x="408" y="536" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="536" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Report family reunification</text><rect x="20" y="550" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="564" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Others, incl. ceased protection</text><text x="258" y="564" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Wrong stock</text><text x="408" y="564" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="564" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Counted as in need of international</text><text x="623" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">protection</text><rect x="20" y="594" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Not in this stock</text><text x="258" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central"></text><text x="408" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">Citizens by birth born abroad who</text><text x="408" y="624" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">fled, if (iii) not collected</text><text x="623" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central"></text><rect x="20" y="638" width="840" height="26" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><text x="28" y="651" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Persons returned after seeking protection (IRRS paras 95 to 97)</text><rect x="20" y="664" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="678" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Repatriating refugees; other</text><text x="28" y="694" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">returnees</text><text x="258" y="678" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">No</text><text x="408" y="678" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central"></text><text x="623" y="678" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start" dominant-baseline="central">Not covered by Box A.2</text><rect x="20" y="708" width="840" height="44" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.6"/><text x="28" y="722" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central